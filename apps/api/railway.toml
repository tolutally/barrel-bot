[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run db:generate && npm run build --workspace @barrel/api"

[deploy]
preDeployCommand = "npm run db:deploy"
startCommand = "npm run start --workspace @barrel/api"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
